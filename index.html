<script>
(function(){
  const pages=window.FLIP_PAGES||[];
  if(!pages.length){document.getElementById('status').textContent='Failed to load pages.';return;}
  document.getElementById('status').hidden=true;
  const bookEl=document.getElementById('book'); bookEl.hidden=false;
  const pageFlip=new St.PageFlip(bookEl,{width:630,height:810,size:'stretch',minWidth:280,maxWidth:1100,minHeight:360,maxHeight:1400,showCover:true,mobileScrollSupport:true,useMouseEvents:true,flippingTime:700,maxShadowOpacity:0.45,drawShadow:true});
  pageFlip.loadFromImages(pages);
  const label=document.getElementById('pageLabel');
  const sync=()=>{label.textContent=(pageFlip.getCurrentPageIndex()+1)+' / '+pageFlip.getPageCount();};
  pageFlip.on('flip',sync); sync();
  document.getElementById('prev').onclick=()=>pageFlip.flipPrev();
  document.getElementById('next').onclick=()=>pageFlip.flipNext();
  document.addEventListener('keydown',(e)=>{if(e.key==='ArrowLeft')pageFlip.flipPrev(); if(e.key==='ArrowRight')pageFlip.flipNext();});
})();
</script>
